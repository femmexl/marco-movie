name: Sync upstream 0.5.0 + msearch fix

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream 0.5.0 source
        run: |
          curl -sL --retry 3 "https://api.github.com/repos/Pilipala9919/MarcoMovie/zipball/v0.5.0-preview" -o /tmp/src.zip
          unzip -q /tmp/src.zip -d /tmp/up

      - name: Replace worktree with 0.5.0
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mv /tmp/up/Pilipala9919-MarcoMovie-*/* .
          rm -rf /tmp/up /tmp/src.zip
          grep "^version:" flutter/pubspec.yaml

      - name: Apply msearch fixes
        run: |
          echo '' | base64 -d > /tmp/apply_fix.py
          python3 /tmp/apply_fix.py

      - name: Commit and push
        run: |
          git config user.name "marco-movie-builder"
          git config user.email "builder@users.noreply.github.com"
          git add -A
          git commit -m "sync: 上游 0.5.0 全量同步 + 移植 msearch 纯数字搜索修复（csp_bridge.dart / Cms.java）"
          git push

      - name: Trigger multiplatform build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-multiplatform.yml --ref main -f target=all
